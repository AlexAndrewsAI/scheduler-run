[project]
name = "scheduler-run"
version = "0.1.0"
description = "A scheduler that runs commands from a CSV file"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AlexAndrewsAI", email = "alex.andrews.ai@protonmail.com"}
]
keywords = ["scheduler", "cron", "automation", "task-scheduler", "csv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",  # Added
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "schedule>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
    "uv",
]

[project.scripts]
scheduler-run = "scheduler_run.cli:app"

[project.urls]
Homepage = "https://github.com/AlexAndrewsAI/scheduler-run"
Repository = "https://github.com/AlexAndrewsAI/scheduler-run.git"
Documentation = "https://github.com/AlexAndrewsAI/scheduler-run#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[tool.ruff]
line-length = 88
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "UP", "ARG", "RUF", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
