[project]
name = "scheduler-run"
dynamic = ["version"]  # Version is read from __init__.py by hatch
description = "A scheduler that runs commands from a YAML file"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "AlexAndrewsAI", email = "alex.andrews.ai@protonmail.com"}
]
keywords = ["scheduler", "cron", "automation", "task-scheduler", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "schedule>=1.2.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
scheduler-run = "scheduler_run.cli:app"

[project.urls]
Homepage = "https://github.com/AlexAndrewsAI/scheduler-run"
Repository = "https://github.com/AlexAndrewsAI/scheduler-run.git"
Documentation = "https://github.com/AlexAndrewsAI/scheduler-run#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "scheduler_run/__init__.py"

[tool.uv]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports)
    "W",   # pycodestyle warnings
    "D",   # pydocstyle (docstring conventions)
    "S",   # flake8-bandit (security checks)
    "B",   # flake8-bugbear (common bugs)
    "I",   # isort (import sorting)
    "G",   # flake8-logging-format (logging format)
    "C4",  # flake8-comprehensions (comprehension optimizations)
    "PT",  # flake8-pytest-style (pytest conventions)
    "UP",  # pyupgrade (modernize Python syntax)
    "ARG", # flake8-unused-arguments (unused function arguments)
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify (code simplification)
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # Allow assert statements in tests
"scheduler_run/cli.py" = ["B008", "ARG001"]  # Typer Option/Argument defaults

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scheduler_run --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["scheduler_run"]
omit = []
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
